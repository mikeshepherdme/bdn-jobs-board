name: Update state government job listings

on:
  schedule:
    # GitHub delays scheduled ("cron") triggers unpredictably under load --
    # sometimes by minutes, sometimes by close to two hours. An earlier
    # version of this workflow required landing in an exact 7am-Eastern hour
    # window, and a run of longer-than-usual delays caused it to miss that
    # window on BOTH daily triggers for a full week (2026-07-30 to 08-06)
    # without ever failing loudly -- it just silently did nothing.
    #
    # Fix: fire every 30 minutes across a wide weekday-morning window (11:00
    # to 15:30 UTC -- this covers 6am-11am Eastern across both DST states,
    # so no timezone-of-day logic is needed at all), and use an "already
    # refreshed today" guard below so only the first successful firing each
    # day does real work. Later, delayed triggers become cheap no-ops.
    - cron: "0,30 11-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if already refreshed today
        id: check
        run: |
          last_date=$(python3 -c "import json; print(json.load(open('data/executive.json')).get('generatedAt','')[:10])" 2>/dev/null || echo "")
          today=$(date -u +%Y-%m-%d)
          echo "Last refresh date: $last_date / today (UTC): $today"
          if [ "$last_date" = "$today" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.should_run == 'true'
        with:
          python-version: "3.11"
      - name: Fetch and filter Executive Branch listings
        if: steps.check.outputs.should_run == 'true'
        run: python3 scripts/fetch_executive_jobs.py
      - name: Fetch and filter Judicial Branch listings
        if: steps.check.outputs.should_run == 'true'
        run: python3 scripts/fetch_judicial_jobs.py
      - name: Fetch and filter Legislature listings
        if: steps.check.outputs.should_run == 'true'
        run: python3 scripts/fetch_legislature_jobs.py
      - name: Commit updated data if changed
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/executive.json data/judicial.json data/legislature.json data/archive.json; then
            git add data/executive.json data/judicial.json data/legislature.json data/archive.json
            git commit -m "Refresh state government job listings"
            git push
          else
            echo "No changes to state government job data"
          fi
